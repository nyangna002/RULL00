<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>룰렛</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { display: flex; gap: 40px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex-wrap: wrap; justify-content: center; }
        
        /* 설정 영역 */
        .settings { width: 250px; }
        .item-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        .item-list li { display: flex; align-items: center; margin-bottom: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        .item-list input { margin-right: 10px; cursor: pointer; }

        /* 룰렛 영역 */
        .roulette-container { position: relative; width: 400px; height: 400px; }
        canvas { border-radius: 50%; border: 5px solid #333; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; 
                   border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff4757; z-index: 10; }
        
        button { margin-top: 20px; padding: 15px 40px; font-size: 18px; cursor: pointer; background: #1e90ff; color: white; border: none; border-radius: 10px; font-weight: bold; }
        button:hover { background: #0984e3; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; color: #333; height: 30px; }
    </style>
</head>
<body>

    <h1>룰렛</h1>
    <div class="container">
        <div class="settings">
            <h3>포함할 항목 선택</h3>
            <ul id="item-list" class="item-list"></ul>
        </div>

        <div class="roulette-container">
            <div class="pointer"></div>
            <canvas id="rouletteCanvas" width="400" height="400"></canvas>
            <center><button onclick="spin()">돌리기!</button></center>
        </div>
    </div>
    <div id="result"></div>

    <script>
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');
        
        // 초기 데이터 (이름만 수정하거나 추가하세요)
        let rawItems = ["01 범태희", "02 안평화", "03 이서진", "04 이현모", "05 고윤희 ", "06 범태하", "07 권해범", "08 휴고", "09 안지호", "10 이송릭", "11 주인철", "12 최이경", "13 서재언", "14 원지원", "15 김연우", "16 김의현", "17 우진형", "18 강시화"];
        let items = rawItems.map(name => ({ name, enabled: true }));

        const colors = ["#ff7675", "#fdcb6e", "#55efc4", "#74b9ff", "#a29bfe", "#fab1a0", "#81ecec", "#dfe6e9"];

        // UI 생성
        function init() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `<label><input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleItem(${idx})"> ${item.name}</label>`;
                listEl.appendChild(li);
            });
            draw();
        }

        function toggleItem(idx) {
            items[idx].enabled = !items[idx].enabled;
            draw();
        }

        function draw() {
            const activeItems = items.filter(i => i.enabled);
            const arc = (2 * Math.PI) / activeItems.length;
            ctx.clearRect(0, 0, 400, 400);

            if (activeItems.length === 0) {
                ctx.fillText("항목 선택", 150, 200);
                return;
            }

            activeItems.forEach((item, i) => {
                const angle = i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // 텍스트 추가
                ctx.save();
                ctx.fillStyle = "#333";
                ctx.font = "bold 16px Arial";
                ctx.translate(200 + Math.cos(angle + arc / 2) * 130, 200 + Math.sin(angle + arc / 2) * 130);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(item.name, -ctx.measureText(item.name).width / 2, 0);
                ctx.restore();
            });
        }

        let isSpinning = false;
        function spin() {
            if (isSpinning) return;
            const activeItems = items.filter(i => i.enabled);
            if (activeItems.length < 2) return alert("최소 2개 이상의 항목이 필요합니다.");

            isSpinning = true;
            resultDiv.innerText = "LOADING";
            
            const randomDegree = Math.floor(Math.random() * 360) + 3600; // 최소 10바퀴
            canvas.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                isSpinning = false;
                // 결과 계산
                const actualDegree = randomDegree % 360;
                const arcDegree = 360 / activeItems.length;
                // 캔버스 회전 방향과 포인터 위치 보정 (포인터가 12시 방향일 때)
                const index = Math.floor((360 - actualDegree + 90) % 360 / arcDegree) % activeItems.length;
                resultDiv.innerText = `오늘의 결과: [${activeItems[index].name}] ;
            }, 4000);
        }

        init();
    </script>
</body>
</html>
