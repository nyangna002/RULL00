<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>룰렛</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; margin: 0; padding: 10px; }
        h1 { font-size: 1.5rem; margin: 15px 0; }

        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 95%; max-width: 500px; box-sizing: border-box; }
        
        /* 설정 영역 */
        .settings { width: 100%; order: 2; }
        .setting-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .setting-header h3 { margin: 0; }
        .batch-btns { display: flex; gap: 5px; }
        .batch-btns button { width: auto; margin-top: 0; padding: 5px 10px; font-size: 0.8rem; background: #636e72; border-radius: 6px; }
        .batch-btns button:hover { background: #2d3436; }

        .item-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; padding: 5px; }
        .item-list li { display: flex; align-items: center; margin-bottom: 5px; padding: 8px; border-bottom: 1px solid #f9f9f9; font-size: 0.9rem; }
        .item-list input { width: 18px; height: 18px; margin-right: 10px; }

        /* 룰렛 영역 */
        .roulette-outer { width: 100%; display: flex; justify-content: center; order: 1; }
        .roulette-container { position: relative; width: 300px; height: 300px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #333; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; 
                   border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid #ff4757; z-index: 10; }
        
        .controls { width: 100%; display: flex; flex-direction: column; align-items: center; order: 3; }
        button { width: 100%; max-width: 250px; margin-top: 15px; padding: 15px; font-size: 1.1rem; cursor: pointer; background: #1e90ff; color: white; border: none; border-radius: 12px; font-weight: bold; }
        button:active { background: #0984e3; transform: scale(0.98); }
        #result { margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #1e90ff; min-height: 30px; text-align: center; }

        /* PC 버전 레이아웃 */
        @media (min-width: 768px) {
            .container { flex-direction: row; max-width: 800px; align-items: flex-start; padding: 30px; }
            .settings { width: 280px; order: 1; }
            .item-list { max-height: 400px; }
            .roulette-outer { width: 400px; order: 2; }
            .roulette-container { width: 400px; height: 400px; }
            .controls { order: 3; width: auto; position: absolute; bottom: 30px; right: 80px; }
        }
    </style>
</head>
<body>

    <h1>멤버 룰렛</h1>
    <div class="container">
        <div class="settings">
            <div class="setting-header">
                <h3>포함 항목</h3>
                <div class="batch-btns">
                    <button onclick="toggleAll(true)">전체 선택</button>
                    <button onclick="toggleAll(false)">전체 해제</button>
                </div>
            </div>
            <ul id="item-list" class="item-list"></ul>
        </div>

        <div class="roulette-outer">
            <div class="roulette-container">
                <div class="pointer"></div>
                <canvas id="rouletteCanvas" width="800" height="800"></canvas>
            </div>
        </div>

        <div class="controls">
            <button id="spinBtn" onclick="spin()">돌리기!</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');
        
        let rawItems = ["owner (호유원)", "130666 (김솔음)", "74 (이강헌)", "bye bye bye (백사헌)", "D (J3)", "J (B조 조장)", "jealousy (류재관)", "Morpho (진나솔)",  "Mu (최 요원)", "Nightmare (이강헌)", "OP (백사헌)", "Y (김솔음)", "靑 (청달래)", "네버랜드를 떠나며 (이성해)", "아뇨 (백사헌)", "암막 커튼 (김솔음)", "오바 (은하제)", "키세스 (김솔음)", "퇴근 (이결)", "네임리스 (호유원)"];
        let items = rawItems.map(name => ({ name, enabled: true }));
        const colors = ["#ff7675", "#fdcb6e", "#55efc4", "#74b9ff", "#a29bfe", "#fab1a0", "#81ecec", "#dfe6e9"];

        function init() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `<label style="width:100%; display:block; cursor:pointer;"><input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleItem(${idx})"> ${item.name}</label>`;
                listEl.appendChild(li);
            });
            draw();
        }

        function toggleItem(idx) {
            items[idx].enabled = !items[idx].enabled;
            draw();
        }

        // 전체 선택 / 전체 해제 함수
        function toggleAll(status) {
            items.forEach(item => item.enabled = status);
            init();
        }

        function draw() {
            const activeItems = items.filter(i => i.enabled);
            ctx.clearRect(0, 0, 800, 800);

            if (activeItems.length === 0) {
                ctx.fillStyle = "#333";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("항목을 선택해주세요", 400, 400);
                return;
            }

            const arc = (2 * Math.PI) / activeItems.length;

            activeItems.forEach((item, i) => {
                const angle = i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(400, 400);
                ctx.arc(400, 400, 400, angle, angle + arc);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#333";
                ctx.font = "bold 20px Arial";

                const textAngle = angle + arc / 2;
                const isLeft = textAngle > Math.PI / 2 && textAngle < Math.PI * 1.5;

                // 조각의 중앙 위치 계산 (반지름 250 위치)
                ctx.translate(400 + Math.cos(textAngle) * 250, 400 + Math.sin(textAngle) * 250);
                ctx.rotate(textAngle);

                if (isLeft) {
                    ctx.rotate(Math.PI);
                }

                // 텍스트 정렬을 중앙(center)으로 설정
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.name, 0, 0);
                
                ctx.restore();
            });
        }

        let isSpinning = false;
        let currentRotation = 0;

        function spin() {
            if (isSpinning) return;
            const activeItems = items.filter(i => i.enabled);
            if (activeItems.length < 2) return alert("최소 2개 이상의 항목이 필요합니다.");

            isSpinning = true;
            spinBtn.disabled = true;
            resultDiv.innerText = "LOADING";
            
            const randomAdd = Math.floor(Math.random() * 360) + 3600; 
            currentRotation += randomAdd;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                const actualDegree = currentRotation % 360;
                const arcDegree = 360 / activeItems.length;
                const index = Math.floor((360 - (actualDegree % 360) + 270) % 360 / arcDegree) % activeItems.length;
                resultDiv.innerText = `결과: [${activeItems[index].name}]`;
            }, 4000);
        }

        init();
    </script>
</body>
</html>
